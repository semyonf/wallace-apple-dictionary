on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: Node.js CI

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:cov
